host: "localhost"
port: 8080
# uncomment the next line to prevent auto connection at startup
# autoConnect: false
# uncomment the next line to use a custom token server (can not be changed in the ui)
# tokenServerUrl: "https://example.org/token/"
# uncomment the next line to use multiple custom token servers, comma separated - the first is used by default (can be changed in the ui)
# tokenServerUrl: [https://example.org/token/, https://example.net/rvs/]